<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Помощник Опера</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="eyebrow">MVP · v0.1</div>
      <h1>Помощник Опера</h1>
      <p>Загрузите исходные данные, выберите документ и получите готовый файл.</p>
    </header>

    <section class="card">
      <label class="step">
        <span class="step-number">1</span>
        <span>
          <strong>Исходные данные</strong>
          <small>Excel .xlsx</small>
        </span>
      </label>

      <input id="file" type="file" accept=".xlsx">
      <div id="fileName" class="file-name">Файл не выбран</div>
    </section>

    <section class="card">
      <label class="step">
        <span class="step-number">2</span>
        <span>
          <strong>Документ</strong>
          <small>Выберите шаблон</small>
        </span>
      </label>

      <select id="document">
        <option value="proработка">Проработка</option>
      </select>
    </section>

    <section class="card">
      <label class="step">
        <span class="step-number">3</span>
        <span>
          <strong>Формат</strong>
          <small>Доступный формат</small>
        </span>
      </label>

      <div class="format">Excel (.xlsx)</div>
    </section>

    <button id="generate" disabled>Сформировать документ</button>
    <div id="status" class="status"></div>
  </main>

<script>
const fileInput = document.getElementById('file');
const fileName = document.getElementById('fileName');
const button = document.getElementById('generate');
const status = document.getElementById('status');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  fileName.textContent = file ? file.name : 'Файл не выбран';
  button.disabled = !file;
  status.textContent = '';
});

button.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  button.disabled = true;
  button.textContent = 'Формируем…';
  status.textContent = '';

  try {
    const form = new FormData();
    form.append('file', file);

    const response = await fetch('/api/generate/proработка', {
      method: 'POST',
      body: form
    });

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.detail || 'Ошибка генерации');
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Проработка_готово.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    status.textContent = 'Готово. Файл отправлен на скачивание.';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = 'Сформировать документ';
  }
});
</script>
</body>
</html>
