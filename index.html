<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Помощник Опера</title><link rel="stylesheet" href="style.css"></head><body><main><header><div>РАБОЧИЙ ИНСТРУМЕНТ</div><h1>Помощник Опера</h1><p>Создание документов из исходных данных прямо в браузере.</p></header><section><b>01</b><h2>Исходные данные</h2><p>Загрузите Excel-файл с данными.</p><label class="upload"><input id="file" type="file" accept=".xlsx,.xls">Выбрать Excel-файл</label><small id="fileName">Файл не выбран</small></section><section><b>02</b><h2>Документ</h2><select><option>Проработка</option></select></section><section><b>03</b><h2>Формат</h2><div class="format">Excel (.xlsx)</div></section><button id="generate" disabled>Сформировать документ</button><div id="status"></div><footer>Обработка файлов выполняется в браузере.</footer></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.js"></script></body></html>
